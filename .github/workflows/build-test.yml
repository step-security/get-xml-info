name: Build Test

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read  # for actions/checkout to fetch code
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node: ["24"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies with NPM
        run: |
          npm install

      - name: Build new release
        run: npm run build

  self-test:
    permissions:
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run the action against test.xml
        id: getxml
        uses: ./
        with:
          xml-file: 'test.xml'
          xpath: '//version'
      - name: Assert output
        run: |
          if [ "${{ steps.getxml.outputs.info }}" != "1.0.20" ]; then
            echo "Expected 1.0.20, got: ${{ steps.getxml.outputs.info }}"
            exit 1
          fi

      - name: Run the action against test-bom.xml (UTF-8 with BOM)
        id: getxmlbom
        uses: ./
        with:
          xml-file: 'test-bom.xml'
          xpath: '//version'
      - name: Assert BOM output
        run: |
          if [ "${{ steps.getxmlbom.outputs.info }}" != "1.0.20" ]; then
            echo "Expected 1.0.20, got: ${{ steps.getxmlbom.outputs.info }}"
            exit 1
          fi
